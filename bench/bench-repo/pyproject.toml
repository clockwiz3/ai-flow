[project]
name = "rentwise"
version = "0.1.0"
description = "Rentwise: a small equipment rental shop API (tools, camping and photo gear)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<0.28",
    "pytest>=8,<9",
    "ruff>=0.7,<0.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
