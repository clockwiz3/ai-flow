[project]
name = "forgeloop"
version = "0.1.0"
description = "A hand-written agentic development pipeline (ticket -> plan -> code -> gates -> PR) with an eval of what each gate buys"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.scripts]
forgeloop = "forgeloop.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forgeloop", "llmcore"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["bench/bench-repo", "bench/tasks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM108"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["forgeloop", "llmcore", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls real model APIs (opt-in)",
    "docker: needs a running Docker daemon",
]
addopts = "-m 'not live'"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.uv]
python-preference = "only-managed"
